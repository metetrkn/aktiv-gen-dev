<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Posts</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; }
        .post { margin-bottom: 40px; }
        .post img { max-width: 100%; height: auto; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>Latest Posts</h1>
    {% for post in posts %}
        <div class="post">
            <h2>{{ post.title }}</h2>
            <p>{{ post.text }}</p>
            {% if post.image %}
                <img src="{{ post.image.url }}" alt="{{ post.title }}">
            {% endif %}
            <p><small style="color: gray;">Posted on: {{ post.created_at|date:"F d, Y H:i" }}</small></p>
        </div>
        <hr>
    {% empty %}
        <p>No posts yet. Go to the admin panel and add some!</p>
    {% endfor %}
</body>
</html>
